[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "incidentos-mcp"
version = "0.1.0"
description = "FastMCP stdio server exposing IncidentOS controlled tools to agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp==1.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
incidentos-mcp = "incidentos_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["incidentos_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
